<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPI STATUS 2026 Button</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#2355a3;
    font-family:Rakkas, serif;
}

.spi-button{
    padding:15px 30px;
    font-size:32px;
    font-weight:bold;
    color:#fcfceb;
    background:#0dbd04;
    border-radius:15px;
    text-decoration:none;
    box-shadow:0 0 20px rgba(0,0,0,.3);
    white-space:nowrap;
}

.spi-button:hover{
    transform:scale(1.05);
}

/* Individual letters */
.spi-button span{
    display:inline-block;
    animation:wave 4s ease-in-out infinite;
    transform-origin:center bottom;
}

/* Sequential delays */
.spi-button span:nth-child(1){animation-delay:0.00s;}
.spi-button span:nth-child(2){animation-delay:0.05s;}
.spi-button span:nth-child(3){animation-delay:0.10s;}
.spi-button span:nth-child(4){animation-delay:0.15s;}
.spi-button span:nth-child(5){animation-delay:0.20s;}
.spi-button span:nth-child(6){animation-delay:0.25s;}
.spi-button span:nth-child(7){animation-delay:0.30s;}
.spi-button span:nth-child(8){animation-delay:0.35s;}
.spi-button span:nth-child(9){animation-delay:0.40s;}
.spi-button span:nth-child(10){animation-delay:0.45s;}
.spi-button span:nth-child(11){animation-delay:0.50s;}
.spi-button span:nth-child(12){animation-delay:0.55s;}
.spi-button span:nth-child(13){animation-delay:0.60s;}
.spi-button span:nth-child(14){animation-delay:1.05s;}
.spi-button span:nth-child(15){animation-delay:1.10s;}
.spi-button span:nth-child(16){animation-delay:1.15s;}
.spi-button span:nth-child(17){animation-delay:1.20s;}
.spi-button span:nth-child(18){animation-delay:1.25s;}
.spi-button span:nth-child(19){animation-delay:1.44s;}

/* Smooth flag wave */
@keyframes wave{
    0%,100%{
        transform:translateY(0px) rotate(0deg);
    }
    25%{
        transform:translateY(-20px) rotate(2deg);
    }
    50%{
        transform:translateY(0px) rotate(0deg);
    }
    75%{
        transform:translateY(20px) rotate(-2deg);
    }
}
</style>
</head>
<body>

   target="_blank"
