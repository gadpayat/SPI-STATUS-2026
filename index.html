<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPI STATUS 2026 Button</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#2355a3;
    font-family:Rakkas, serif;
}

.spi-button{
    padding:15px 30px;
    font-size:28px;
    font-weight:bold;
    color:#fcfceb;
    background:#0dbd04;
    border:none;
    border-radius:15px;
    cursor:pointer;
    text-decoration:none;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
    white-space:nowrap;
}

.spi-button:hover{
    transform:scale(1.05);
}

/* Each character */
.spi-button span{
    display:inline-block;
    animation:wave 1.8s ease-in-out infinite;
}

/* Staggered delays create the flag effect */
.spi-button span:nth-child(1){animation-delay:0.0s;}
.spi-button span:nth-child(2){animation-delay:0.1s;}
.spi-button span:nth-child(3){animation-delay:0.2s;}
.spi-button span:nth-child(4){animation-delay:0.3s;}
.spi-button span:nth-child(5){animation-delay:0.4s;}
.spi-button span:nth-child(6){animation-delay:0.5s;}
.spi-button span:nth-child(7){animation-delay:0.6s;}
.spi-button span:nth-child(8){animation-delay:0.7s;}
.spi-button span:nth-child(9){animation-delay:0.8s;}
.spi-button span:nth-child(10){animation-delay:0.9s;}
.spi-button span:nth-child(11){animation-delay:1.0s;}
.spi-button span:nth-child(12){animation-delay:1.1s;}
.spi-button span:nth-child(13){animation-delay:1.2s;}
.spi-button span:nth-child(14){animation-delay:1.3s;}
.spi-button span:nth-child(15){animation-delay:1.4s;}

@keyframes wave{
    0%,100%{
        transform:translateY(0px);
    }
    25%{
        transform:translateY(-10px);
    }
    50%{
        transform:translateY(0px);
    }
    75%{
        transform:translateY(10px);
    }
}
</style>
</head>
<body>
