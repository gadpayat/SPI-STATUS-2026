<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPI STATUS 2026 Button</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#2355a3;
    font-family:Rakkas, Rakkas;
}

.spi-button{
    padding:25px 50px;
    font-size:36px;
    font-weight:bold;
    color:#0066cc;
    background:white;
    border:none;
    border-radius:15px;
    cursor:pointer;
    text-decoration:none;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
    
    /* Blinking Effect */
    animation:blink 1s infinite;
    
    transition:transform 0.3s;
}

.spi-button:hover{
    transform:scale(1.1);
}

@keyframes blink{
    0%, 50%{
        opacity:1;
    }
    51%, 100%{
        opacity:0;
    }
}
</style>
</head>
<body>

<a href="https://docs.google.com/spreadsheets/d/1uSsfjXRx_9rpMK7FA9cZLes4q4ehXBG38V-QyeC6Xf4/edit?pli=1&gid=776864011#gid=776864011" target="_blank" class="spi-button">
    🚨 SPI STATUS 2026 🚨
</a>

</body>
</html>
