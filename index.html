<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPI STATUS 2026 Button</title>
    
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    
<style>
    
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#2355a3;
    font-family:'Orbitron', sans-serif;
}

.spi-button{
    position:relative;
    padding:18px 38px;
    font-size:32px;
    font-weight:bold;
    color:#000000;
    text-decoration:none;
    text-align:center;
    border-radius:18px;
    white-space:nowrap;
    overflow:hidden;

    box-shadow:
    inset 0 2px 2px rgba(255,255,255,.7),
    inset 0 -3px 5px rgba(0,0,0,.25),
    0 8px 20px rgba(0,0,0,.35);
    
    /* Gold metallic gradient */
    background: linear-gradient(
    135deg,
    #FFF9E3,
    #FDE68A,
    #FACC15,
    #EAB308,
    #CA8A04,
    #FACC15,
    #FFF9E3
);

    border:2px solid rgba(255,255,255,0.4);

    /* Realistic 3D depth */
    box-shadow:
        inset 0 3px 6px rgba(255,255,255,0.8),
        inset 0 -4px 8px rgba(255,215,0,0.25),
        0 4px 0 #d4af37,
        0 8px 18px rgba(0,0,0,0.45),
        0 0 20px rgba(255,215,0,0.4);

    transition:all .25s ease;
}

/* Glitter sparkle layer */
.spi-button::before{
    content:"";
    position:absolute;
    top:0;
    left:-150%;
    width:80%;
    height:100%;

    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,.15),
        rgba(255,255,255,.95),
        rgba(255,255,255,.15),
        transparent
    );

    transform:skewX(-25deg);
    animation:goldShine 4s linear infinite;
}

/* Random glitter highlights */
.spi-button::after{
    content:"";
    position:absolute;
    inset:0;

    background:
      radial-gradient(circle at 10% 20%, rgba(255,255,255,1) 1px, transparent 3px),
      radial-gradient(circle at 25% 70%, rgba(255,255,255,1) 1px, transparent 3px),
      radial-gradient(circle at 40% 30%, rgba(255,255,255,1) 1px, transparent 3px),
      radial-gradient(circle at 55% 80%, rgba(255,255,255,1) 1px, transparent 3px),
      radial-gradient(circle at 70% 25%, rgba(255,255,255,1) 1px, transparent 3px),
      radial-gradient(circle at 85% 60%, rgba(255,255,255,1) 1px, transparent 3px);

    animation:glitter 1.5s infinite alternate;
    pointer-events:none;
}

.spi-button:hover{
    transform:translateY(-3px) scale(1.05);

    box-shadow:
        inset 0 3px 8px rgba(255,255,255,.9),
        inset 0 -8px 12px rgba(120,80,0,.5),
        0 6px 0 #8b6508,
        0 14px 28px rgba(0,0,0,.5),
        0 0 30px rgba(255,215,0,.8);
}

.spi-button:active{
    transform:translateY(3px);

    box-shadow:
        inset 0 3px 8px rgba(255,255,255,.7),
        inset 0 -5px 8px rgba(120,80,0,.4),
        0 2px 0 #8b6508,
        0 4px 8px rgba(0,0,0,.4);
}

/* Keep text above shine layers */
.spi-button span{
    position:relative;
    z-index:2;
}

/* Moving gold shine */
@keyframes goldShine{
    0%{
        left:-150%;
    }
    100%{
        left:200%;
    }
}

/* Glitter twinkle */
@keyframes glitter{
    0%{
        opacity:.3;
    }
    100%{
        opacity:1;
    }
}

.spi-button:hover{
    transform:scale(1.05);
}

/* Individual letters */
.spi-button span{
    display:inline-block;
    transform-origin:center bottom;
    animation:wave 3s linear infinite;
}

/* Sequential delays */
.spi-button span:nth-child(1){animation-delay:0.00s;}
.spi-button span:nth-child(2){animation-delay:0.03s;}
.spi-button span:nth-child(3){animation-delay:0.06s;}
.spi-button span:nth-child(4){animation-delay:0.09s;}
.spi-button span:nth-child(5){animation-delay:0.12s;}
.spi-button span:nth-child(6){animation-delay:0.15s;}
.spi-button span:nth-child(7){animation-delay:0.18s;}
.spi-button span:nth-child(8){animation-delay:0.21s;}
.spi-button span:nth-child(9){animation-delay:0.24s;}
.spi-button span:nth-child(10){animation-delay:0.27s;}
.spi-button span:nth-child(11){animation-delay:0.30s;}
.spi-button span:nth-child(12){animation-delay:0.33s;}
.spi-button span:nth-child(13){animation-delay:0.36s;}
.spi-button span:nth-child(14){animation-delay:0.39s;}
.spi-button span:nth-child(15){animation-delay:0.42s;}
.spi-button span:nth-child(16){animation-delay:0.45s;}
.spi-button span:nth-child(17){animation-delay:0.48s;}
.spi-button span:nth-child(18){animation-delay:0.51s;}
.spi-button span:nth-child(19){animation-delay:0.54s;}

/*
   First 33% = Fast Wave
   Remaining 67% = Pause
*/
@keyframes wave{

    0%{
        transform:translateY(0px) rotate(0deg);
    }

    8%{
        transform:translateY(-20px) rotate(4deg);
    }

    16%{
        transform:translateY(20px) rotate(-4deg);
    }

    24%{
        transform:translateY(-8px) rotate(2deg);
    }

    33%{
        transform:translateY(0px) rotate(0deg);
    }

    /* Pause */
    34%,100%{
        transform:translateY(0px) rotate(0deg);
    }
}
</style>
</head>
